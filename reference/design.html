<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>USG Whole Abdomen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky header; phone = one column + section strip + bottom dock; iPad landscape adds a sidebar; Mac adds a live report pane. */
:root{
  --bg:#FAF9F5; --surface:#FFFFFF; --sunk:#F0EEE6; --line:#E3E0D5;
  --fg:#141413; --muted:#6F6D66;
  --accent:#B4552F; --accent-fill:#C96442; --on-accent:#FFFFFF; --accent-soft:#F5E1D6;
  --ok:#5B7A4A;
  --ink-ink:#1F1E1C; --ink-red:#C2412D; --ink-blue:#2F5FB3; --ink-hl:#F2C230; --paper:#FFFFFF;
  --serif:"Anthropic Serif","Tiempos Text",ui-serif,"New York",Georgia,"Times New Roman",serif;
  --sans:"Anthropic Sans","Styrene B",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --hh:58px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#262624; --surface:#30302E; --sunk:#1F1E1D; --line:#45443F;
  --fg:#F4F3EE; --muted:#A6A39A;
  --accent:#E8906F; --accent-fill:#D97757; --on-accent:#FFFFFF; --accent-soft:#4A3127;
  --ok:#9DBB86; --ink-ink:#F2F0E9; --ink-red:#F0896C; --ink-blue:#8FB4F5; --ink-hl:#E8BE3E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262624; --surface:#30302E; --sunk:#1F1E1D; --line:#45443F;
  --fg:#F4F3EE; --muted:#A6A39A;
  --accent:#E8906F; --accent-fill:#D97757; --on-accent:#FFFFFF; --accent-soft:#4A3127;
  --ok:#9DBB86; --ink-ink:#F2F0E9; --ink-red:#F0896C; --ink-blue:#8FB4F5; --ink-hl:#E8BE3E; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;height:var(--hh)}
.brand{min-width:0}
.t1{font:600 17px/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t1 span{color:var(--muted);font-weight:400}
.t2{font-size:12px;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.acts{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.prog{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.prog svg{transform:rotate(-90deg)}
@media (max-width:430px){#progTxt{display:none}.t1 span{display:none}}
.icon{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:transparent}
.icon:hover,.btn:hover{background:var(--sunk)}
.btn{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:550;white-space:nowrap}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.05);background:var(--accent-fill)}
.btn.warn{border-color:var(--accent);color:var(--accent)}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:0 10px}
.strip::-webkit-scrollbar{display:none}
.strip a{flex:none;display:inline-flex;gap:6px;align-items:center;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg);font-size:13px}
.strip a.cur{border-color:var(--fg)}
.cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cnt.ok{color:var(--ok)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent-fill);flex:none}

/* Page grid */
.app{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;max-width:1520px;margin:0 auto;padding-block:16px 132px}
.side,.pane{display:none}
main{min-width:0;display:flex;flex-direction:column;gap:14px;width:100%;max-width:780px;margin:0 auto}
@media (min-width:1024px){
  .app{grid-template-columns:196px minmax(0,1fr);padding-top:20px}
  .strip{display:none}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(var(--hh) + 20px + env(safe-area-inset-top,0px));align-self:start}
  main{margin:0}
}
@media (min-width:1280px){
  .app{grid-template-columns:196px minmax(0,1fr) minmax(360px,440px);padding-bottom:32px}
  .pane{display:flex;flex-direction:column;position:sticky;top:calc(var(--hh) + 20px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100dvh - var(--hh) - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  .dock{display:none!important}
}
.side a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--fg);font-size:14px}
.side a .cnt{margin-left:auto}
.side a:hover{background:var(--sunk)}
.side a.cur{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.side .tools{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.side .tools .btn{width:100%}
.side .note{font-size:12px;color:var(--muted);margin-top:10px;padding:0 4px}

/* Sections */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;container-type:inline-size;scroll-margin-top:calc(112px + env(safe-area-inset-top,0px))}
@media (min-width:1024px){.sec{scroll-margin-top:calc(var(--hh) + 20px + env(safe-area-inset-top,0px))}}
.sec-h{display:flex;align-items:center;gap:10px;padding:14px 16px 12px}
.sec-h h2{font:600 19px/1.2 var(--serif);margin:0;text-wrap:balance}
.badge{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:999px;background:var(--sunk)}
.badge.ok{color:var(--ok)}
.sec-h .btn{margin-left:auto;height:32px}

.row{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
@container (min-width:560px){.row{grid-template-columns:150px minmax(0,1fr);align-items:start}.rl{padding-top:9px}}
.rl{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.rl::before{content:"";width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok);opacity:.8}
.row.todo .rl::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent);opacity:1}
.row.abn .rl{color:var(--accent)}
.row.abn .rl::before{background:var(--accent-fill);opacity:1}
.row.na .rl{color:var(--muted);font-weight:500}
.row.na .rl::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.rc{display:flex;flex-direction:column;gap:10px;min-width:0}
.rc.sides{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@container (min-width:620px){.rc.sides{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.sidebox{display:flex;flex-direction:column;gap:8px;min-width:0}
.sidetag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650}
.namsg{font-size:13px;color:var(--muted);padding:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:14px;touch-action:manipulation;transition:background .12s,border-color .12s}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"][data-n]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"]:not([data-n]){background:var(--accent-fill);color:var(--on-accent);border-color:var(--accent-fill)}
@media (pointer:coarse){.chip{min-height:42px;font-size:15px;padding:0 15px}}
.flds{display:flex;flex-wrap:wrap;gap:8px}
.fld{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:13px;color:var(--muted)}
.fld input{border:0;background:transparent;font:16px var(--sans);color:var(--fg);width:5.5ch;outline:none;min-width:0;padding:8px 0}
.fld.txt{flex:1 1 200px}.fld.txt input{flex:1;width:100%}
.fld.wide{flex:1 1 100%}
.fld em{font-style:normal}
.fld:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld.need{border-color:var(--accent);border-style:dashed}
.fld.sub{padding:4px 6px 4px 10px;gap:4px}
.mini{min-width:36px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.mini[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* Patient + summary */
.pgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:2px 16px 16px}
@container (min-width:520px){.pgrid{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}
.in{display:flex;flex-direction:column;gap:5px;min-width:0}
.in>label,.lbl{font-size:12px;color:var(--muted);font-weight:650;letter-spacing:.03em}
.in input,.in textarea{font:16px/1.4 var(--sans);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-height:42px}
.in input[type="date"]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;line-height:22px}
.in input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0}
.in input[type="date"]::-webkit-calendar-picker-indicator{opacity:.6}
.in input:focus,.in textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.in textarea{resize:none;overflow:hidden}
.age{display:flex;align-items:center;gap:8px}.age input{flex:1}.sexsw{display:flex;gap:4px;flex:none}.sexsw .mini{height:42px;min-width:46px;border-radius:10px;font-size:15px}
.sumb{display:flex;flex-direction:column;gap:16px;padding:2px 16px 16px}
.draft{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--sunk);font:15px/1.5 var(--serif)}
.draft ul{margin:4px 0 0;padding-left:18px}
.draft-h{display:flex;align-items:center;gap:8px;font:12px var(--sans);color:var(--muted);font-weight:650;letter-spacing:.03em}
.draft-h .btn{margin-left:auto;height:30px}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchips .chip{min-height:34px;font-size:13px}

/* Report */
.pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rep-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.rep-h b{font:600 16px var(--serif);margin-right:auto}
.rep{overflow:auto;flex:1;min-height:0;padding:18px 20px 28px}
.doc{max-width:64ch;margin:0 auto;font:15px/1.55 var(--serif)}
.doc .inst{text-align:center;font-size:13px;color:var(--muted);line-height:1.35}
.doc .inst b{display:block;color:var(--fg);font-size:14px}
.doc h3{font:650 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.doc .ttl{text-align:center;font:600 14px var(--serif);letter-spacing:.04em;margin:14px 0 4px;text-decoration:underline;text-underline-offset:3px}
.doc .pt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:14px;margin-top:12px}
.doc .pt dt{color:var(--muted)}.doc .pt dd{margin:0;overflow-wrap:anywhere}
.doc p{margin:0 0 8px}
.doc ul{margin:0;padding-left:20px}
.doc li{margin-bottom:3px}
.doc .auto{font:12px var(--sans);color:var(--muted);margin-left:6px;font-weight:500}
.doc .sig{margin-top:22px;font-size:14px}
.doc .ph{color:var(--muted);font-style:italic}
.warn-l{font:13px/1.4 var(--sans);color:var(--accent);background:var(--accent-soft);padding:8px 10px;border-radius:8px;margin-bottom:12px}

/* Dock, sheet, toast */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:8px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.dock .btn{flex:1;height:46px;border-radius:12px;font-size:14.5px;padding:0 10px}
@media (min-width:760px){.dock{left:auto;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));padding:8px;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px rgb(0 0 0 / .12)}.dock .btn{flex:none;padding:0 18px}}
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .rep-h{min-height:56px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:14px;align-items:center;background:var(--fg);color:var(--bg);border-radius:12px;padding:11px 14px;font-size:14px;max-width:calc(100vw - 32px);box-shadow:0 8px 28px rgb(0 0 0 / .2)}
@media (min-width:1280px){.toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%,30%{background:var(--accent-soft)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:2px solid var(--accent)}.chip{transition:none}}
/* Handwriting */
[data-ink]{position:relative}
.inkc{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3}
.inking .inkc{pointer-events:auto;touch-action:none;cursor:crosshair}
.pen-seen.inking .inkc{touch-action:manipulation}
.inking [data-ink]{outline:1px dashed color-mix(in srgb,var(--accent) 32%,transparent);outline-offset:-3px}
.icon[aria-pressed="true"]{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.inkbar{position:fixed;left:0;right:0;bottom:0;z-index:26;display:flex;gap:4px;align-items:center;justify-content:center;padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
@media (min-width:760px){.inkbar{left:50%;right:auto;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));padding:6px 8px;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px rgb(0 0 0 / .14)}}
.tool{width:42px;height:42px;flex:none;border-radius:11px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--fg)}
.tool:hover{background:var(--sunk)}
.tool[aria-pressed="true"]{background:var(--sunk);border-color:var(--fg)}
.tool:disabled{opacity:.35;cursor:default}
@media (max-width:400px){.tool{width:38px}}
.sw{width:20px;height:20px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 15%,transparent)}
.sw.hl{width:12px;height:22px;border-radius:3px;transform:rotate(30deg);opacity:.8}
.inkbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.inkbar .done{height:42px;padding:0 16px;margin-left:4px}
.doc .note{margin:4px 0 12px}
.doc .note figcaption{font:12px var(--sans);color:var(--muted);margin-bottom:4px}
.doc .note img{display:block;max-width:100%;height:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px}
.print-only{display:none}
@media print{
  .top,.app,.dock,.sheet,.toast{display:none!important}
  .print-only{display:block!important}
  body{background:#fff}
  #repPrint .doc,#repPrint .doc *{color:#000!important}
  #repPrint .doc{max-width:none;font-size:12.5pt}
  .warn-l,.auto{display:none}
}
</style>

<header class="top">
  <div class="bar gut">
    <div class="brand">
      <div class="t1">USG Whole Abdomen <span id="sexT">· Male</span></div>
      <div class="t2">AIIMS Guwahati · Radiology</div>
    </div>
    <div class="acts">
      <span class="prog" id="prog" title="Rows marked">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--line)" stroke-width="2.5"/><circle id="ring" cx="11" cy="11" r="9" fill="none" stroke="var(--accent-fill)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="56.55" stroke-dashoffset="56.55"/></svg>
        <span id="progTxt">0/0</span>
      </span>
      <button type="button" class="icon" id="inkBtn" aria-pressed="false" aria-label="Handwriting" title="Handwriting"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4 20l1.2-4.6L15.6 5a2.1 2.1 0 0 1 3 0l.4.4a2.1 2.1 0 0 1 0 3L8.6 18.8z"/><path d="M13.5 7.1l3.4 3.4"/></svg></button>
      <button type="button" class="icon" id="themeBtn" aria-label="Theme: system"></button>
      <button type="button" class="btn" id="newBtn">New</button>
    </div>
  </div>
  <nav class="strip gut" id="strip" aria-label="Sections"></nav>
</header>

<div class="app gut">
  <aside class="side" aria-label="Sections">
    <nav id="sideNav"></nav>
    <div class="tools">
      <button type="button" class="btn" id="sideNext">Next unmarked</button>
      <button type="button" class="btn" id="sideRest">Mark the rest normal</button>
    </div>
    <p class="note">Drafts save on this device only.</p>
  </aside>

  <main id="main">
    <section class="sec" id="s-pt" data-sec="pt">
      <div class="sec-h"><h2>Patient</h2></div>
      <div class="pgrid">
        <div class="in full"><label for="p-name">Name</label><input id="p-name" data-p="name" autocomplete="off" autocapitalize="words"></div>
        <div class="in"><label for="p-age">Age / Sex</label><div class="age"><input id="p-age" data-p="age" inputmode="numeric" autocomplete="off" placeholder="Years"><div class="sexsw" role="group" aria-label="Sex"><button type="button" class="mini" data-sex="M" aria-pressed="true">M</button><button type="button" class="mini" data-sex="F" aria-pressed="false">F</button></div></div></div>
        <div class="in"><label for="p-date">Date</label><input id="p-date" data-p="date" type="date"></div>
        <div class="in"><label for="p-cr">CR No</label><input id="p-cr" data-p="cr" autocomplete="off" inputmode="numeric"></div>
        <div class="in"><label for="p-usg">USG No</label><input id="p-usg" data-p="usg" autocomplete="off"></div>
        <div class="in"><label for="p-bill">Bill No</label><input id="p-bill" data-p="bill" autocomplete="off"></div>
        <div class="in"><label for="p-ref">Referred by</label><input id="p-ref" data-p="ref" autocomplete="off"></div>
        <div class="in full"><label for="p-clin">Clinical details / remark</label><textarea id="p-clin" data-p="clin" rows="1"></textarea></div>
      </div>
    </section>

    <div id="secs" style="display:contents"></div>

    <section class="sec" id="s-sum" data-sec="sum">
      <div class="sec-h"><h2>Impression &amp; sign-off</h2></div>
      <div class="sumb">
        <div class="in"><label for="t-add">Additional findings</label><textarea id="t-add" data-t="add" rows="1"></textarea></div>
        <div class="in">
          <label for="t-imp">Impression</label>
          <div class="draft" id="draft"></div>
          <textarea id="t-imp" data-t="imp" rows="2" placeholder="Leave empty to use the suggestion above, or write your own (one point per line)"></textarea>
        </div>
        <div class="in">
          <label for="t-adv">Advice</label>
          <div class="qchips" id="advChips"></div>
          <textarea id="t-adv" data-t="adv" rows="1"></textarea>
        </div>
        <div class="in">
          <span class="lbl">Reporting consultant</span>

{id:'panc',t:'Pancreas',rows:[
 {id:'seen',l:'Seen',m:1,def:['Head','Body','Tail'],o:[

]},
{id:'spl',t:'Spleen',rows:[
 {id:'size',l:'Size',o:[

  {v:'Enlarged',s:'Spleen is enlarged[ ({cm} cm)]',i:'splenomegaly',f:[num('cm','Size','cm')]}]},
 {id:'echo',l:'Echotexture, lesion',o:[

 {id:'sv',l:'Splenic vein',o:[

{id:'kid',t:'Kidneys',sides:1,rows:[
 {id:'size',l:'Size',o:[

 {id:'cmd',l:'Echo, CMD',m:1,o:[

  {v:'CMD lost',s:'Corticomedullary differentiation is lost',i:'loss of CMD'}]},
 {id:'calc',l:'Calculus',o:[
  {v:'No',n:1,s:'No calculus'},

 {id:'hdn',l:'HDN',o:[
  {v:'No',n:1,s:'No hydronephrosis'},

 {id:'ure',l:'Ureter',o:[

 {id:'les',l:'Lesion / cyst',o:[
  {v:'No',n:1,s:'No focal lesion or cyst'},

]},
{id:'ub',t:'Urinary bladder',short:'Bladder',rows:[

 {id:'wall',l:'Wall',m:1,o:[

  {v:'Trabeculated',s:'Wall is trabeculated',i:'trabeculation'}]},
 {id:'lumen',l:'Lumen',m:1,o:[
  {v:'N',n:1,x:1,s:'Lumen is clear'},
  {v:'Calculus',s:'Calculus is seen in the lumen[ ({mm} mm)]',i:'vesical calculus',f:[num('mm','Size','mm')]},
  {v:'Mass',s:'An intraluminal mass is seen[ ({t})]',i:'intravesical mass',f:[txt('t','Details','e.g. 2 cm, left lateral wall')]},

 {id:'pvr',l:'PVR',o:[

]},
{id:'pro',t:'Prostate',sex:'M',rows:[
 {id:'vol',l:'Volume',o:[
  {v:'N',n:1,s:'Prostate is normal in size[ (volume {cc} cc)]',f:[num('cc','Volume','cc')]},

 {id:'echo',l:'Echo, median lobe',o:[

 {id:'sv',l:'Seminal vesicles',o:[
  {v:'N',n:1,s:'Seminal vesicles are normal'},
  ab('Seminal vesicles: {t}','seminal vesicles {t}')]}
]},
{id:'oth',t:'Others',sep:1,rows:[
 {id:'ff',l:'Free fluid',o:[
  {v:'No',n:1,s:'No free fluid'},
  ...['Mild','Moderate','Gross'].map(g=>({v:g,s:g+' free fluid[ in the {site}]',i:g.toLowerCase()+' free fluid[ in the {site}]',f:[txt('site','Site','e.g. pelvis')]}))]},
 {id:'ao',l:'Aorta, IVC',o:[
  {v:'N',n:1,s:'Aorta and IVC are normal'},
  ab(0,0,'e.g. infrarenal aortic aneurysm')]},

  say:s=>s.includes('No')?'No pleural effusion':(s.length===2?'Bilateral pleural effusion':s[0]+' pleural effusion'),
  imp:s=>s.includes('No')||!s.length?[]:[s.length===2?'bilateral pleural effusion':s[0].toLowerCase()+' pleural effusion']},
 {id:'ln',l:'Lymph nodes',o:[

const DOCS=[['Dr. Pranjal Phukan','Professor'],['Dr. Deb. Kr. Boruah','Additional Professor'],['Dr. Kalyan Sarma','Associate Professor'],['Dr. Prince Das','Assistant Professor']];
const ADV=['Clinical correlation.','Correlate with LFT.','Follow-up ultrasound.','Further evaluation with CECT abdomen.','Urology consultation.'];
const KID_IMP_ORDER=['size','calc','hdn','ure','cmd','les'];

/* ---------- State ---------- */
const KEY='usg-abd-male-v1', TKEY='usg-abd-theme';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const blank=()=>({p:{date:today(),sex:'M'},r:{},add:'',imp:'',adv:'',con:'',res:'',ink:{},inkWord:true});
const sex=()=>S.p.sex==='F'?'F':'M';
const act=()=>SECS.filter(s=>!s.sex||s.sex===sex());
const SEXW={M:'Male',F:'Female'};
const titleTxt=()=>`ULTRASOUND WHOLE ABDOMEN (${SEXW[sex()].toUpperCase()})`;
let S=(()=>{try{const j=localStorage.getItem(KEY);if(j){const o=JSON.parse(j);if(o&&o.r)return Object.assign(blank(),o)}}catch(e){}return blank()})();

const sidesOf=sec=>sec.sides?['R','L']:[null];
const key=(s,r,sd)=>sd?`${s}.${r}.${sd}`:`${s}.${r}`;
const IDX={};
SECS.forEach(sec=>sec.rows.forEach(row=>sidesOf(sec).forEach(sd=>IDX[key(sec.id,row.id,sd)]={sec,row,sd})));
const opt=(row,v)=>row.o.find(o=>o.v===v);
const st=k=>S.r[k]||(S.r[k]={s:[],f:{}});
const peek=k=>S.r[k]||{s:[],f:{}};

function naSet(sec,sd){
  const set=new Set();
  sec.rows.forEach(row=>peek(key(sec.id,row.id,sd)).s.forEach(v=>(opt(row,v)?.na||[]).forEach(x=>set.add(x))));
  return set;
}
function marked(sec,row,sd){
  const x=peek(key(sec.id,row.id,sd));
  if(!x.s.length) return false;
  return x.s.every(v=>(opt(row,v)?.f||[]).every(f=>!f.req||String(x.f[f.k]??'').trim()));
}
const isAbn=(row,x)=>x.s.some(v=>!opt(row,v)?.n);

/* ---------- Text generation ---------- */
function fill(tpl,f,sd){
  if(!tpl) return '';
  const get=k=>{
    if(k==='Side') return sd==='R'?'Right':'Left';
    if(k==='side') return sd==='R'?'right':'left';
    const [kk,mod]=k.split('.'); let v=String(f[kk]??'').trim();
    return mod==='l'?v.toLowerCase():v;
  };
  let out=tpl.replace(/\[([^\[\]]*)\]/g,(m,inner)=>{let ok=true;const r=inner.replace(/\{([\w.]+)\}/g,(m2,k)=>{const v=get(k);if(!v)ok=false;return v});return ok?r:''});
  out=out.replace(/\{([\w.]+)\}/g,(m,k)=>get(k));
  return out.replace(/\b([Aa]) (?=[aeiou])/g,'$1n ').replace(/\s+/g,' ').trim();
}
function secSentences(sec,sd){
  const na=naSet(sec,sd), ss=[];
  sec.rows.forEach(row=>{
    if(na.has(row.id)||!marked(sec,row,sd)) return;
    const x=peek(key(sec.id,row.id,sd));
    if(row.say) ss.push(row.say(x.s,x.f,sd));
    else x.s.forEach(v=>ss.push(fill(opt(row,v).s,x.f,sd)));
  });
  let out=ss.filter(Boolean).map(sent);
  if(sd&&out.length&&!marked(sec,sec.rows[0],sd)) out.unshift((sd==='R'?'Right':'Left')+' kidney:');
  return out.join(' ');
}
function findings(){
  const P=[];
  act().forEach(sec=>sidesOf(sec).forEach(sd=>{const t=secSentences(sec,sd);if(t)P.push({g:sec.id,t})}));
  return P;
}
function frags(sec,sd,order){
  const na=naSet(sec,sd), out=[];
  (order?order.map(id=>sec.rows.find(r=>r.id===id)):sec.rows).forEach(row=>{
    if(na.has(row.id)||!marked(sec,row,sd)) return;
    const x=peek(key(sec.id,row.id,sd));
    const a=row.imp?row.imp(x.s):x.s.map(v=>{const o=opt(row,v);return(!o.n&&o.i)?fill(o.i,x.f,sd):''});
    a.forEach(t=>{t=lc1(t);if(t&&!out.includes(t))out.push(t)});
  });
  return out;
}
function kidLine(side,fr,bil){
  fr=fr.slice(); let head;
  if(fr[0]==='calculus'){head=bil?'Bilateral renal calculi':`${side} renal calculus`;fr.shift()}
  else{head=(bil?'Both kidneys':`${side} kidney`)+': '+fr.shift()}
  return head+(fr.length?' with '+andJoin(fr):'');
}
function impression(){
  const L=[];
  act().forEach(sec=>{
    if(sec.sides){
      const per={};
      ['R','L'].forEach(sd=>{
        const f=frags(sec,sd,KID_IMP_ORDER);
        const h=f.findIndex(t=>/hydronephrosis$/.test(t)), u=f.indexOf('dilated ureter');
        if(h>-1&&u>-1){f[h]=f[h].replace('hydronephrosis','hydroureteronephrosis');f.splice(u,1)}
        per[sd]=f;
      });
      if(per.R.length&&per.R.join('|')===per.L.join('|')) L.push(kidLine('',per.R,true));
      else{if(per.R.length)L.push(kidLine('Right',per.R));if(per.L.length)L.push(kidLine('Left',per.L))}
      return;
    }
    const f=frags(sec,null);
    if(!f.length) return;
    if(sec.sep) f.forEach(t=>L.push(cap(t)));
    else L.push(cap(f[0])+(f.length>1?' with '+andJoin(f.slice(1)):''));
  });
  return L.map(sent);
}
function counts(){
  let tot=0,done=0;const per={};
  act().forEach(sec=>{
    let t=0,d=0,a=false;
    sidesOf(sec).forEach(sd=>{const na=naSet(sec,sd);sec.rows.forEach(row=>{
      if(na.has(row.id))return;t++;if(marked(sec,row,sd))d++;if(isAbn(row,peek(key(sec.id,row.id,sd))))a=true;})});
    per[sec.id]={t,d,a};tot+=t;done+=d;
  });
  return {tot,done,per};
}
const fmtDate=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');return m?`${m[3]}/${m[2]}/${m[1]}`:(d||'')};
function report(){
  const c=counts(), auto=impression();
  const own=S.imp.trim()?S.imp.split(/\n+/).map(t=>t.replace(/^\s*[-•*]\s*/,'').trim()).filter(Boolean).map(sent):null;
  let imp=own||auto;
  if(!own&&!imp.length&&c.done>0) imp=['No significant abnormality detected on ultrasound of the whole abdomen.'];
  const con=DOCS.find(d=>d[0]===S.con);
  return {c,paras:findings(),imp,impAuto:!own,p:S.p,add:S.add.trim(),adv:S.adv.trim(),con,res:S.res.trim()};
}
function reportText(){
  const R=report(),p=R.p,L=[];
  L.push(titleTxt(),'');
  const kv=(k,v)=>v?`${k}: ${v}`:'';
  const line=(...a)=>{const t=a.filter(Boolean).join('    ');if(t)L.push(t)};

let saving=false;
async function saveWord(){
  if(saving) return; saving=true;

    const bytes=buildDocx(),name=docName(),c=counts(),left=c.tot-c.done;

      catch(e){const code=e&&e.code;if(code==='declined')return;toast(code==='rate_limited'?'A save is already waiting for your answer.':'The Word file could not be saved here.')}

      const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();

let io;
function observe(){
  if(!('IntersectionObserver' in window))return;
  io&&io.disconnect();
  io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){cur=en.target.dataset.sec;
    $$('[data-go]').forEach(a=>a.classList.toggle('cur',a.dataset.go===cur));
    const a=$(`#strip [data-go="${cur}"]`);if(a){const s=$('#strip');s.scrollTo({left:a.offsetLeft-s.clientWidth/2+a.offsetWidth/2,behavior:reduce()?'auto':'smooth'})}}})},{rootMargin:'-35% 0px -60% 0px'});
